<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maqueta — Quarto Studio</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
/* Variables de respaldo: imitan las del anfitrión donde se mostró la maqueta. */
:root{color-scheme:light;
--bg-primary:#ffffff;--surface-1:#f4f3ef;--surface-2:#ffffff;
--text-primary:#1c1c1e;--text-secondary:#6b6b66;--text-muted:#8e8e88;
--text-accent:#2563eb;--text-success:#15803d;--text-warning:#b45309;--text-danger:#b91c1c;
--border:rgba(0,0,0,.12);--border-strong:rgba(0,0,0,.24);--border-accent:#2563eb;--border-danger:#dc2626;--border-warning:#d97706;
--bg-accent:#dbe7fd;--bg-accent-muted:#eef3fe;--bg-success:#dcfce7;--bg-warning:#fef3c7;--bg-danger:#fee2e2;
--fill-accent:#2563eb;--fill-success:#16a34a;--fill-warning:#d97706;--fill-danger:#dc2626;--fill-ghost-selected:rgba(0,0,0,.06);
--on-accent:#ffffff;--radius:8px;
--font-sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"JetBrains Mono",ui-monospace,monospace;--font-voice:Georgia,"Source Serif 4",serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg-primary:#1c1c1e;--surface-1:#242426;--surface-2:#2c2c2e;
--text-primary:#f5f5f0;--text-secondary:#a0a09a;--text-muted:#7c7c76;
--text-accent:#7aa7ff;--text-success:#4ade80;--text-warning:#fbbf24;--text-danger:#f87171;
--border:rgba(255,255,255,.12);--border-strong:rgba(255,255,255,.24);--border-accent:#7aa7ff;
--bg-accent:#1e3a6e;--bg-accent-muted:#1a2740;--bg-success:#14532d;--bg-warning:#4a3410;--bg-danger:#4c1d1d;
--fill-ghost-selected:rgba(255,255,255,.08)}}
body{margin:0;padding:24px 16px;background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;line-height:1.5}
main{max-width:1100px;margin:0 auto}
.encabezado{margin:0 0 14px}.encabezado h1{font-size:18px;font-weight:600;margin:0}
.encabezado p{margin:4px 0 0;color:var(--text-secondary);font-size:12px}
button{font:inherit;color:var(--text-primary);background:var(--surface-2);border:0.5px solid var(--border-strong);border-radius:var(--radius);cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
<style>
/* La metáfora de Quarto Studio: Tres paneles de escritor: los sitios y sus entradas, el .qmd con su encabezado YAML y la página tal como saldrá publicada. Renderizar un solo archivo es el botón principal. Acento propio #2563eb; en la app el color sale del tema de KDE. */
.nota-maqueta{color:var(--text-secondary);font-size:13px;margin:0 0 12px;max-width:820px}
.win{border:0.5px solid var(--border);border-radius:12px;overflow:hidden;font-size:12px;background:var(--surface-2);box-shadow:0 8px 30px rgb(0 0 0 / .10)}
.tit{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:0.5px solid var(--border);background:var(--surface-1)}
.mut{color:var(--text-secondary);font-size:11px}
.row{display:flex;align-items:center;gap:6px}
.btn{font-size:11px;padding:3px 9px}
.pane{border-right:0.5px solid var(--border);padding:8px;overflow:hidden}
.dt{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
</style>
</head>
<body>
<main>
<header class="encabezado"><h1>Maqueta — Quarto Studio</h1>
<p>Aprobada el 2026-11-18 (versión «identidad propia»).</p></header>
<p class="nota-maqueta">Tres paneles de escritor: los sitios y sus entradas, el .qmd con su encabezado YAML y la página tal como saldrá publicada. Renderizar un solo archivo es el botón principal.</p>
<div id="vista" aria-label="Ventana de Quarto Studio"></div>
</main>
<script>
const A={"quarto": "#2563eb"};
const el=id=>document.getElementById(id);
const tb=(c,t,extra)=>`<div class="tit"><i class="ti ${t[0]}" style="color:${c};font-size:15px" aria-hidden="true"></i><span style="font-weight:500">${t[1]}</span>${extra||""}</div>`;
const vista=c=>`<div class="win">${tb(c,["ti-world","Quarto"],`<span class="mut">res-publica › posts › pobreza-2024.qmd</span><span style="flex:1"></span><button class="btn" style="background:${c};color:#fff;border-color:${c}">Renderizar este archivo</button><button class="btn">Publicar…</button>`)}
<div style="display:grid;grid-template-columns:140px minmax(0,1fr) minmax(0,1fr);height:270px">
<div class="pane">${["web (hub)","aequilibria","methodica","pecunia-fluxus","res-publica"].map((s,i)=>`<div style="padding:2px 0;${i===4?"font-weight:500":""}"><i class="ti ti-${i===4?"folder-open":"folder"}" style="color:${c}" aria-hidden="true"></i> ${s}</div>${i===4?`<div style="padding-left:16px;color:${c}">pobreza-2024.qmd</div><div style="padding-left:16px" class="mut">ciclo-2023.qmd</div>`:""}`).join("")}</div>
<div class="pane mono" style="background:var(--surface-1)"><span class="mut">---</span><br><span style="color:${c}">title:</span> "La pobreza en 2024, región por región"<br><span style="color:${c}">date:</span> 2026-11-18<br><span style="color:${c}">categories:</span> [pobreza, ENAHO]<br><span class="mut">---</span><br><br>La pobreza monetaria bajó en 2024, pero no en todas las regiones…<br><br><span class="mut">\`\`\`{python}</span><br>grafico_pobreza(region=True)<br><span class="mut">\`\`\`</span></div>
<div style="padding:12px"><div style="font-family:var(--font-voice);font-size:17px;line-height:1.3;margin-bottom:6px">La pobreza en 2024, región por región</div><div class="mut" style="margin-bottom:8px">18 nov 2026 · pobreza · ENAHO</div><div style="font-family:var(--font-voice);font-size:12px;line-height:1.6;margin-bottom:8px">La pobreza monetaria bajó en 2024, pero no en todas las regiones…</div><div style="display:flex;align-items:flex-end;gap:4px;height:60px">${[40,55,32,60,48,25].map(h=>`<div style="flex:1;height:${h}px;background:${c};opacity:.75;border-radius:2px 2px 0 0"></div>`).join("")}</div></div></div>
<div class="row mut" style="border-top:0.5px solid var(--border);padding:5px 10px"><span class="dt" style="background:var(--text-success)"></span>Render en 1,2 s · 0 problemas<span style="flex:1"></span>3 sitios con cambios sin publicar</div></div>`;
el("vista").innerHTML=vista("#2563eb");
</script>
</body>
</html>
