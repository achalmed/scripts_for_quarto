# suite.yml — contrato de la suite (esquema en core/suite.schema.yml); core/suites.py generar escribe los índices y READMEs.
nombre: generador_publicacion_similar
objetivo: publicacion
resumen: Genera los índices de contenido (_contenido_<subblog>.qmd) de un blog con enlaces a artículo y PDF.
escribe_en:
- web
simula_por_defecto: false
comandos:
- main.sh <BLOG_DIR>
- main.sh <BLOG_DIR> --dry-run
estado: activo
depende_de:
- bash
