# backend/script_generador_publicacion_similar/suite.yml — suite generador_publicacion_similar: Genera los índices de contenido (_contenido_<subblog>.qmd) de un blog con enlaces a artículo y PDF.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: generador_publicacion_similar
objetivo: publicacion
resumen: Genera los índices de contenido (_contenido_<subblog>.qmd) de un blog con enlaces a artículo y PDF.
escribe_en:
- web
simula_por_defecto: false
pruebas: python3 -m pytest -q tests -p no:cacheprovider --basetemp ~/.cache/pytest/quarto-ola4   # desde la raíz del repo; fixtures y remoto bare en temporal (ola 4, Q1b)
comandos:
- main.sh <BLOG_DIR>
- main.sh <BLOG_DIR> --dry-run
estado: activo
depende_de:
- bash
