# backend/script_metadata_manager/metadata_config.yml — configuración del sistema de gestión de metadatos Quarto (blogs permitidos, campos, etiquetas y rutas)
# Todo lo editable vive aquí; lo lee lib/config.py. La versión de la suite se declara una sola vez en el código (NORMATIVA §3).

# -----------------------------------------------------------------------------
# BLOGS PERMITIDOS
# -----------------------------------------------------------------------------
# Lista de blogs que serán procesados
# Si está vacía, se procesarán todos los blogs encontrados
# Útil para excluir carpetas que no son blogs

# Los pub_* se localizan automáticamente como submódulos del hub, cuya carpeta es
# la carpeta del hub (INDEX_DIR de core/env) desde 2026-09-06 (repo website-achalma): <hub>/_pubs/pub_*.
# Basta el nombre de la carpeta; "website-achalma" sigue aceptado como alias.
allowed_blogs:
  - pub_actus-mercator
  - pub_aequilibria
  - pub_axiomata
  - pub_chaska
  - pub_dialectica-y-mercado
  - pub_epsilon-y-beta
  - pub_methodica
  - pub_numerus-scriptum
  - pub_optimums
  - pub_pecunia-fluxus
  - pub_res-publica
  - 04 index/blog
  # Agregar más blogs según necesidad

# -----------------------------------------------------------------------------
# CARPETAS A EXCLUIR
# -----------------------------------------------------------------------------
# Carpetas adicionales que NO son blogs y deben ser ignoradas
# Nota: _site, _freeze, .git, etc. ya están excluidas por defecto

excluded_folders:
  - apa                                           # Plantillas APA
  - mytestproyect                                 # Proyectos de prueba
  - academia
  - biblioteca
  - doc_2fa vault
  - doc_administrativos
  - doc_agenda
  - doc_educativos
  - doc_financieros
  - doc_identidad
  - doc_propiedad
  - doc_registro civil
  - geogebra
  - gestion empresarial
  - ideas
  - idiomas
  - infox python
  - latex
  - logos y tipografias
  - ofimatica
  - prompts
  - propuesta bicentenario
  - scripts-biblioteca
  - scripts_document_studio
  - scripts-linux
  - scripts-quarto
  - scripts_for_zotero
  - spss
  - stata
  - whatsapp chat
  - 04 index/about
  - 04 index/beschikbaarheid
  - 04 index/talk
  - 04 index/publication
  # Agregar más carpetas según necesidad

# -----------------------------------------------------------------------------
# DIRECTORIO DE SALIDA PARA EXCEL
# -----------------------------------------------------------------------------
# Ubicación donde se guardarán los archivos Excel generados. Una ruta relativa
# se resuelve contra la carpeta de esta herramienta (sin la clave, también
# excel_databases/ de aquí); una absoluta o con ~ se respeta tal cual.

excel_output_dir: excel_databases

# =============================================================================
# NOTAS DE USO
# =============================================================================
#
# 1. ALLOWED_BLOGS:
#    - Si la lista está vacía [], se procesan todos los blogs
#    - Si tiene elementos, solo se procesan los listados
#    - Útil para enfocarse en blogs específicos
#
# 2. EXCLUDED_FOLDERS:
#    - Nombres exactos de carpetas a ignorar
#    - No usar rutas, solo nombres
#    - Las carpetas del sistema (_site, etc.) ya están excluidas
#
# 3. EXCEL_OUTPUT_DIR:
#    - Si no existe, se crea automáticamente
#    - Todos los Excel se guardarán aquí
#    - Facilita organización centralizada
#
# 4. PARA USAR ESTE ARCHIVO:
#    python quarto_metadata_manager.py create-template ~/Documents/publicaciones \
#        --config metadata_config.yml
#
# =============================================================================