# backend/script_blogs_manager/suite.yml — suite blogs_manager: Gestiona el hub 04 index y sus pubs: listar, render, preview, publicar, crear posts APA, operaciones git y backups.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: blogs_manager
objetivo: publicacion
resumen: 'Gestiona el hub 04 index y sus pubs: listar, render, preview, publicar, crear posts APA, operaciones git y backups.'
escribe_en:
- web
- git
- archivos
simula_por_defecto: false
pruebas: python3 -m pytest -q tests -p no:cacheprovider --basetemp ~/.cache/pytest/quarto-ola4   # desde la raíz del repo; fixtures y remoto bare en temporal (ola 4, Q1b)
comandos:
- 'main.sh                      # menú'
- main.sh list
- main.sh render <blog>
- main.sh publish <blog> [--aplicar]         # simula; sin destino, puerta R6 y git push
- main.sh git-commit <blog> <mensaje> [--aplicar]
- main.sh help
estado: activo
entrada: 04 index y 04 index/_pubs/pub_*
depende_de:
- quarto
- git
