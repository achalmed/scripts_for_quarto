# backend/script_format_yaml/suite.yml — suite format_yaml: Repara el bloque YAML de los .qmd (delimitador --- pegado y líneas en blanco sobrantes) en una carpeta, de forma recursiva e idempotente.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: format_yaml
objetivo: publicacion
resumen: Repara el bloque YAML de los .qmd (delimitador --- pegado y líneas en blanco sobrantes) en una carpeta, de forma recursiva e idempotente.
escribe_en:
- web
simula_por_defecto: false
pruebas: python3 -m pytest -q tests -p no:cacheprovider --basetemp ~/.cache/pytest/quarto-ola4   # desde la raíz del repo; fixtures y remoto bare en temporal (ola 4, Q1b)
comandos:
- main.py --directory <carpeta> --recursive --dry-run
- main.py --directory <carpeta> --recursive
- main.py --file archivo.qmd
estado: activo
nota: fix_qmd_files.py queda como alias de main.py (FS3)
